<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay demo · fixthis</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.5; color: #1d232a; }
  nav a { margin-right: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; }
  .card h3 { margin: 0 0 4px; }
  #clicks { color: #8a5a00; }
</style>
</head>
<body>
<!--
  Try the overlay: run `npm run build:overlay`, serve the package folder packages/fix-this-page (for example
  `npx serve .`) and open /examples/demo.html?fix. Only the small loader (fixthis.js) is included;
  it adds fixthis-overlay.js from the same folder once the overlay is switched on.
  The page acts like a small app on purpose: it counts clicks, changes pages with pushState, and re-renders a section.
-->
<nav>
  <a href="/home" data-route="/home">Home</a>
  <a href="/team" data-route="/team">Team</a>
  <span id="clicks">Site click handler ran 0 times</span>
</nav>
<main id="app"></main>
<p><button type="button" id="rerender">Re-render the page (like a framework would)</button></p>

<script>
  const ROUTES = {
    '/home': `<h1>Acme gardening</h1>
      <p class="intro">We keep <b>your garden</b> green all year round.</p>
      <p><a href="/contact">Contact us</a></p>`,
    '/team': `<h1>Our team</h1>
      <section class="cards">
        <div class="card"><h3>Anna</h3><p>Garden designer</p></div>
        <div class="card"><h3>Bob</h3><p>Tree specialist</p></div>
      </section>`,
  };
  let clicks = 0;
  const currentRoute = () => (ROUTES[location.pathname] ? location.pathname : '/home');
  const render = () => { document.getElementById('app').innerHTML = ROUTES[currentRoute()]; };
  document.addEventListener('click', (event) => {
    clicks += 1;
    document.getElementById('clicks').textContent = `Site click handler ran ${clicks} times`;
    const link = event.target.closest('[data-route]');
    if (!link) return;
    event.preventDefault();
    history.pushState(null, '', link.dataset.route);
    render();
  });
  // Reloading after navigating needs a server that answers every path with this page, as single-page apps do
  window.addEventListener('popstate', render);
  document.getElementById('rerender').addEventListener('click', render);
  render();
</script>
<script src="../dist/fixthis.js"></script>
</body>
</html>
