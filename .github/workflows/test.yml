name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node 22: `node --test` only expands glob patterns from Node 21 on
      - run: npm ci
      - run: npm test
      - run: npm run build
