name: Release

# Stages the package on npm when a version tag such as v0.2.0 is pushed. Nothing goes live until a maintainer approves it with 2FA
# (npm stage list fix-this-page, then npm stage approve <stage-id>, or the Staged Packages tab on npmjs.com).
# Needs an npm access token in the repository secret NPM_TOKEN, and "private" removed from packages/fix-this-page/package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # npm stage needs a newer npm than the one that ships with Node 22
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./packages/fix-this-page/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: npm test
      # prepublishOnly builds and tests once more
      - run: npm stage publish --workspace fix-this-page --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
