name: Release

# Publishes the package to npm when a version tag such as v0.2.0 is pushed.
# Needs an npm access token in the repository secret NPM_TOKEN, and "private" removed from packages/fix-this-page/package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./packages/fix-this-page/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: npm test
      # prepublishOnly builds and tests once more
      - run: npm publish --workspace fix-this-page --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
